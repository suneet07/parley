[project]
name = "parley"
version = "0.1.0"
description = "Open-source, self-hostable voice agent for customer support: inbound and outbound calls, real tools, human handoff, simulated-customer evals."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pipecat-ai[silero,deepgram,groq,elevenlabs,cartesia,openai,google,webrtc,websocket,runner]",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "langgraph>=0.2",
    "httpx>=0.27",
    "structlog>=24.1",
    "python-dotenv>=1.0",
    "aiosqlite>=0.20",
    "twilio>=9.0",
    "fastembed>=0.9.0",
    "sqlalchemy[asyncio]>=2.0",
]

[project.optional-dependencies]
db = ["asyncpg>=0.29", "pgvector>=0.3", "sqlalchemy[asyncio]>=2.0"]
jobs = ["arq>=0.26", "redis>=5.0"]
telemetry = ["opentelemetry-sdk>=1.26", "opentelemetry-exporter-otlp>=1.26", "langfuse>=2.0"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "types-pyyaml",
]

[project.scripts]
parley = "parley.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["parley", "evals"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "RUF"]
ignore = ["RUF012"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
